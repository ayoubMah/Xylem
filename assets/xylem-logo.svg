<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#12312A"/>
      <stop offset="100%" stop-color="#081712"/>
    </radialGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7BE495"/>
      <stop offset="55%" stop-color="#52E0D0"/>
      <stop offset="100%" stop-color="#2BB3A3"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#52E0D0"/>
      <stop offset="100%" stop-color="#7BE495"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- droplet vessel -->
  <path d="M256 88
           C 256 88, 148 236, 148 326
           A 108 108 0 0 0 364 326
           C 364 236, 256 88, 256 88 Z"
        fill="#52E0D0" fill-opacity="0.06"
        stroke="url(#drop)" stroke-width="17" stroke-linejoin="round"/>

  <!-- veins: leaves merge upward (LSM compaction / water rising) -->
  <g stroke="#7BE495" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.95">
    <!-- level 0 -> level 1 -->
    <path d="M204 352 C 204 322, 210 306, 222 292"/>
    <path d="M240 356 C 238 330, 232 310, 226 296"/>
    <path d="M272 356 C 274 330, 280 310, 286 296"/>
    <path d="M308 352 C 308 322, 302 306, 290 292"/>
    <!-- level 1 -> root -->
    <path d="M224 276 C 226 250, 238 230, 250 216"/>
    <path d="M288 276 C 286 250, 274 230, 262 216"/>
  </g>

  <!-- rising flow out of the root toward the tip -->
  <path d="M256 192 L 256 138" stroke="url(#flow)" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 20"/>

  <!-- nodes -->
  <g fill="#52E0D0">
    <circle cx="204" cy="366" r="12"/>
    <circle cx="240" cy="370" r="12"/>
    <circle cx="272" cy="370" r="12"/>
    <circle cx="308" cy="366" r="12"/>
    <circle cx="224" cy="288" r="13" fill="#63E8C8"/>
    <circle cx="288" cy="288" r="13" fill="#63E8C8"/>
    <circle cx="256" cy="204" r="16" fill="#7BE495"/>
  </g>
</svg>
